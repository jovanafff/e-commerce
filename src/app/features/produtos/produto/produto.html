<mat-card class="produto-card">
    <mat-card-header>
<mat-card-title>{{ nome | uppercase }}</mat-card-title>
    </mat-card-header>

    <mat-card-content>
<p>{{ preco | precoFormatado }}</p>
    </mat-card-content>

    <mat-card-actions>
     <button mat-raised-button color="primary" (click)="selecionarProduto()">selecionar{{nome}}</button>
<button mat-stroked-button color="accent" (click)="adicionarAoCarrinho()">adicionarAoCarrinho</button>

    </mat-card-actions>

</mat-card>
