<mat-toolbar color="primary">
    <span>{{nomeLoja}}</span>
    <span class="flex-spacer"></span>
    <button mat-button routerLink="/">Inicio</button>
    <button mat-button routerLink="/produtos">Produtos</button>
    <button mat-button routerLink="/carrinho">Carrinho {{quantidadeHeader()}}</button>
    <button mat-button routerLink="/checkout">Checkout</button>
    @if(usuarioLogado()){
        <span class="email-usuario">{{usuarioAtual()?.email}}</span>
        <button type="button" (click)="sair()">Sair</button>
    }@else {
        <button mat-button routerLink="/login">Entrar</button>
    }

</mat-toolbar>
